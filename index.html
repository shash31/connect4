<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Connect 4</title>
</head>
<body>
    <h1>Connect 4</h1>

    <section id="settings">
        <h2>Settings</h2>
        
        <div>
            <label for="opp">Play against:</label>
            <select name="opp" id="opp">
                <option value="twoplayer">Two player</option>
                <option value="baseminimax">Basic minimax</option>
                <option value="alphabeta">Alpha Beta Move</option>
                <option value="bigIntBitboard" title="BigInt(64 bit) based bitboard engine(worse in JS)" selected>BigInt Bitboard</option>
                <option value="smibitboard" title="Split smi bitboard based engine(better for JS)">Smi Bitboard</option>
                <option value="wasmbitboard" title="C++/WASM based bitboard(should be fastest)">C++/WASM Bitboard</option>
            </select>
        </div>

        <div>
            <label for="depth">Depth:</label>
            <input type="number" name="depth" id="depth" value="10" min="1">
        </div>

        <div>
            <label>Time limit:</label>
            <select>
                
            </select>
        </div>

        <!-- <button>Apply</button> -->
    </section>

    <section id="info">
        <h2>Info: </h2>
        <ul>
            <li>Nodes searched: <span id="nodes"></span></li>
            <li>Time taken: <span id="timeelapsed"></span></li>
            <li>Nodes per second: <span id="nps"></span></li>
        </ul>
    </section>
    
    <div id="board">
        <div class="column" data-col="0">
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
        </div>
        <div class="column" data-col="1">
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
        </div>
        <div class="column" data-col="2">
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
        </div>
        <div class="column" data-col="3">
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
        </div>
        <div class="column" data-col="4">
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
        </div>
        <div class="column" data-col="5">
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
        </div>
        <div class="column" data-col="6">
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
            <div class="circle-wrapper"><div class="circle"></div></div>
        </div>
    </div>
    <div id="status"></div>
    <section id="controls">
        <button id="undo">Undo</button>
        <button id="enginemove">AI move</button>
        <button id="reset">New Game</button>
    </section>
    <script src="connect4.js"></script>
</body>
</html>
